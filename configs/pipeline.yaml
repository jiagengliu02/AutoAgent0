# SparseDriveV2 + frozen BridgeDrive detection_ft + Claude Opus 5.
judge_mode: bridgedrive_nonprivileged
sparsedrivev2:
  repo_root: third_party/SparseDriveV2
  config: projects/configs/sparsedrive_stage2.py
  checkpoint: ../../checkpoints/sparsedrivev2/sparsedrive_small_b2d_stage2.pth
  device: cuda:0
  python_bin: ${oc.env:SPARSEDRIVEV2_PYTHON_BIN,python3}
  control_frequency: 20.0
  replan_frequency: 20.0
  replan_min_forward_m: 3.0
  replan_trim_min_forward_m: 0.05
  replan_behind_tolerance_m: 0.25
  replan_max_start_distance_m: 3.0
  replan_max_start_lateral_m: 2.5
  route_lookahead_m: 5.0
  route_reentry_enabled: true
  route_reentry_lookahead_m: 12.0
  route_reentry_trigger_ticks: 3
  route_reentry_max_adjacent_lanes: 2
  route_reentry_map_search_points: 12
  route_reentry_completion_ticks: 4
  route_reentry_max_duration_sec: 15.0
  route_projection_search_back: 20
  route_projection_search_ahead: 200
agenticdriving:
  enabled: false
  selector: dummy
  instruction_scorer_enabled: true
  recovery_selector:
    sequence_menu_primitives:
    - brake
    - wait
    - creep
    - creep_back
    - back_left
    - back_right
    sequence_menu_escalate_after_stationary_sec: 10.0
    sequence_menu_stationary_position_tolerance_m: 5.0
    sequence_menu_front_obstacle_distance_m: 10.0
    sequence_menu_front_stopped_vehicle_stationary_sec: 10.0
    sequence_menu_front_stopped_vehicle_speed_threshold_mps: 0.05
    sequence_menu_front_stopped_vehicle_position_tolerance_m: 0.05
    sequence_menu_escalation_primitives:
    - swerve_left
    - swerve_right
    - lane_left
    - lane_right
    - lane_bypass_left
    - lane_bypass_right
    sequence_back_steer_max_lateral_m: 0.3
    road_context: true
    road_context_distance: true
    enabled: false
    select_primitive: false
    select_recovery_plan: true
    recovery_plan_bypass_first: true
    recovery_plan_bypass_primitive: lane_bypass_left
    recovery_plan_temporal_image_gap_sec: 1.0
    recovery_plan_temporal_image_sample_sec: 0.2
    probability_sample_multiplier: 30.0
    temporal_tree_search: true
    temporal_tree_budget_per_primitive: 18
    temporal_tree_duration_scales:
    - 0.75
    - 1.0
    - 1.25
    temporal_tree_start_delays_sec:
    - 0.0
    - 0.5
    - 1.0
    - 1.5
    temporal_tree_bypass_target_speeds_mps:
    - 6.0
    - 8.0
    - 10.0
    - 12.0
    temporal_tree_bypass_accels_mps2:
    - 3.5
    - 4.5
    temporal_tree_bypass_total_steps:
    - 8
    - 9
    - 10
    - 12
    temporal_tree_bypass_entry_steps:
    - 2
    - 3
    - 4
    temporal_tree_bypass_return_steps:
    - 2
    - 3
    temporal_tree_bypass_settle_steps:
    - 1
    - 2
    select_sequence: false
    sequence_max_steps: 4
    include_brake: true
    select_parameters: true
    preverify_parameter_ranges: true
    parameter_range_samples: 21
    camera_mode: front_only
    backend: anthropic
    model_id: claude-opus-5
    api_key_env: ANTHROPIC_API_KEY
    claude_effort: low
    enable_thinking: false
    max_new_tokens: 256
    select_max_new_tokens: 800
    timeout_sec: 60.0
    select_timeout_sec: 60.0
    max_queries_per_episode: 15
    preload_on_init: true
    select_max_attempts: 1
    save_debug_artifacts: true
    recovery_location_repeat_limit: 5
    recovery_location_reset_distance_m: 3.0
  semantic_takeover:
    enabled: true
    trigger_periodically: false
    trigger_after_recovery: true
    periodic_check_interval_sec: 5.0
    post_recovery_delay_sec: 3.0
    min_check_interval_sec: 5.0
    require_confirmation: true
    confirmation_delay_sec: 1.5
    confidence_threshold: 0.92
    result_max_age_sec: 6.0
    semantic_takeover_cooldown_sec: 30.0
    post_recovery_retakeover_min_sec: 12.0
    max_semantic_takeovers_per_episode: 2
    max_new_tokens: 180
    timeout_sec: 12.0
    save_debug_artifacts: true
  stop_sign:
    enabled: true
    lookahead_m: 30.0
    waypoint_step_m: 2.0
    camera_mode: front_only
    confidence_threshold: 0.65
    result_max_age_sec: 20.0
    stop_speed_threshold_mps: 0.1
    hold_sec: 0.5
    stop_offset_before_junction_m: 2.5
    assumed_brake_decel_mps2: 5.0
    brake_reaction_sec: 0.2
    min_brake_trigger_distance_m: 4.0
    rearm_clear_sec: 3.0
    max_new_tokens: 100
    timeout_sec: 12.0
    save_debug_artifacts: true
  recovery:
    enabled: true
    hd_map_endpoint_only: true
    stuck_trigger:
      enabled: true
      timeout_sec: 5.0
      position_tolerance_m: 1.0
    primitive_tier_veto: true
    primitive_full_plan_dac: true
    hold_dac_guard: true
    hold_dac_guard_ticks: 2
    bypass_return_nc_guard: true
    lane_bypass_wait_timeout_sec: 30.0
    allowed_primitives:
    - brake
    - wait
    - creep
    - creep_back
    - swerve_left
    - swerve_right
    - back_left
    - back_right
    - back_bypass_left
    - back_bypass_right
    - three_point
    - lane_left
    - lane_right
    - lane_bypass_left
    - lane_bypass_right
    include_privileged_info: true
    lane_bypass_min_gap_m: 0.0
    lane_bypass_clearance_buffer_m: 1.0
    lane_bypass_required_time_sec: 4.0
    lane_bypass_min_time_gap_sec: 4.5
    obstacle_clearance_m: 4.0
    commit_and_hold: true
    random_order: false
    rank_without_ep: true
    tie_break_order:
    - brake
    - creep
    - creep_back
    - back_left
    - back_right
    - swerve_left
    - swerve_right
    - back_bypass_left
    - back_bypass_right
    - three_point
    - lane_left
    - lane_right
    - lane_bypass_left
    - lane_bypass_right
    tabu_exempt:
    - creep_back
    allow_failed_primitive_escalation: false
    failure_memory:
      guidance_mode: productivity
      enabled: true
      clear_after_loop1_sec: 5.0
      max_events: 64
carla:
  graphics_adapter: 0
  output_dir: ${oc.env:AGENTICDRIVING_RUN_DIR,output/episode}
  auto_run_id: true
  overwrite_scenario_output: true
  scenarios_dir_name: scenarios
  camera_rig: full_6cam
  predictions_dir: predictions
  control:
    mode: sparsedrivev2_pid
    speed_lookahead_sec: 0.5
    lane_change_speed_lookahead_sec: 1.5
    lane_change_accel_hold_sec: 2.0
    lane_change_brake_ratio: 1.15
    max_accel_mps2: 3.5
    max_brake_mps2: 4.0
    model_speed_gain: 1.3
    model_speed_gain_min_mps: 5.5
    model_speed_gain_max_mps: 20.0
    target_speed_max_drop_mps2: 4.0
    pedestrian_caution_speed_mps: 4.0
    pedestrian_proximity_speed_mps: 7.0
    pedestrian_proximity_distance_m: 20.0
    pedestrian_bbox_stop_distance_m: 8.0
    vehicle_bbox_stop_clearance_m: 3.0
    pedestrian_caution_stationary_speed_mps: 0.3
    pedestrian_caution_distance_m: 30.0
    pedestrian_caution_lateral_m: 6.0
    pedestrian_ttc_brake_hold_sec: 1.0
    debug: true
  recording:
    enabled: true
    dir_name: recordings
    camera: front_topdown
    overlay: comparison
    video_quality: low
    fps: 20
    frame_stride: 4
perception:
  source: bridgedrivev2
  bridgedrive:
    lead_root: third_party/LEAD
    leaderboard_root: third_party/LEAD/3rd_party/leaderboard
    scenario_runner_root: third_party/LEAD/3rd_party/scenario_runner
    carla_python_root: ${oc.env:CARLA_ROOT}/PythonAPI/carla
    checkpoint_dir: checkpoints/bridgedrive
    python_bin: ${oc.env:BRIDGEDRIVE_PYTHON_BIN,python3}
    device: cuda:0
    step_num: 20
    full_camera_rig: true
  occupancy_static_agents: false
  semantic_pedestrian_agents: true
  semantic_pedestrian_min_component_cells: 2
  semantic_pedestrian_duplicate_distance_m: 2.0
  record_ground_truth: false
  fuse_privileged_static_props: false
  replace_sensed_static_props_with_privileged: false
  include_environment_objects: false
  fuse_privileged_environment_objects: false
  hd_map_lane_annotations: true
  score_threshold: 0.35
  max_range_m: 76.0
  inference_stride: 4
  max_staleness_sec: 1.0
  radar_bbox_enabled: true
  radar_bbox_max_distance_m: 35.0
  radar_bbox_lateral_limit_m: 8.0
  radar_bbox_max_heading_error_deg: 45.0
  radar_bbox_association_margin_m: 1.5
  radar_bbox_min_points: 5
  radar_bbox_min_unique_sensors: 1
  radar_bbox_quantile: 0.1
  radar_bbox_longitudinal_padding_m: 0.15
  radar_bbox_lateral_padding_m: 0.25
  radar_bbox_blend: 0.6
  radar_bbox_min_extent_scale: 0.7
  radar_bbox_max_extent_scale: 1.3
  radar_bbox_max_center_shift_m: 0.75
  radar_bbox_gate_stationary_memory: true
  radar_bbox_gate_vehicle_stop: true
  radar_bbox_confirmation_max_age_sec: 0.8
  lidar_bbox_enabled: true
  lidar_front_static_agents: true
  lidar_bbox_static_min_points: 4
  lidar_bbox_static_min_vertical_span_m: 0.15
  lidar_bbox_static_ground_clearance_m: 0.08
  lidar_bbox_max_distance_m: 35.0
  lidar_bbox_lateral_limit_m: 8.0
  lidar_bbox_longitudinal_association_margin_m: 1.0
  lidar_bbox_lateral_association_margin_m: 0.75
  lidar_bbox_min_points: 12
  lidar_bbox_min_vertical_span_m: 0.25
  lidar_bbox_ground_clearance_m: 0.18
  lidar_bbox_max_object_height_m: 4.0
  lidar_bbox_quantile: 0.05
  lidar_bbox_longitudinal_padding_m: 0.1
  lidar_bbox_lateral_padding_m: 0.2
  lidar_bbox_blend: 0.85
  lidar_bbox_min_extent_scale: 0.4
  lidar_bbox_max_extent_scale: 1.25
  lidar_bbox_max_center_shift_m: 1.5
  lidar_bbox_max_near_edge_shift_m: 3.0
  lidar_bbox_rebuild_static_longitudinal_bounds: true
  lidar_bbox_gate_degenerate_static: true
  lidar_bbox_min_static_extent_m: 0.5
  lidar_bbox_gate_unconfirmed_static: true
  lidar_bbox_gate_static_memory: true
  stationary_memory_enabled: true
  stationary_memory_min_frames: 3
  stationary_memory_match_distance_m: 2.0
  stationary_memory_max_age_sec: 2.0
  stationary_vru_review: true
scorer:
  end2end: true
  rule_based: true
  end2end_pdms_branch: true
  target_region_pdms_branch: true
  region_samples_per_region: 3
  region_random_seed: 0
  pdms_gate_native_argmax: false
verifier:
  sample_timestep_sec: 0.1
  hd_map_endpoint_only: true
  type: pdms
  threshold: 0.43
  lk_deviation_limit_m: 1.5
  lk_horizon_window_sec: 2.0
  plan_retime_a_max: 3.5
  plan_retime_brake_max: 4.0
  dac_gate_horizon_sec: 1.0
  dac_exit_grace: true
  dac_mode: tiered
  nc_gate_horizon_sec: 1.5
  pedestrian_gate_horizon_sec: 3.0
  min_walker_speed_mps: 1.5
  stationary_vehicle_lateral_margin_m: 0.0
  gate_horizon_stop_conditioned: true
  gate_horizon_reaction_sec: 0.5
  vru_ttc_veto: true
  ttc_debounce_steps: 1
  probe_horizons_sec:
  - 0.2
  - 0.3
  - 0.5
  - 0.8
  - 1.0
  agent_forecast_mode: bicycle
  normal_ep_gate: false
  debug: true
